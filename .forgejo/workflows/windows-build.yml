name: Windows builds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Test and build Windows x64
    # Native Windows runner; jobs wait here while the runner is offline.
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out source
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: https://data.forgejo.org/actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Protocol and settings tests
        run: npm test
      - name: Electron UI tests
        run: npm run test:ui
      - name: Build Windows downloads
        run: npm run build
      - name: Verify packaged app and prepare downloads
        run: ./scripts/verify-windows-build.ps1
      # Forgejo's artifact service uses v3 rather than GitHub's v4+ protocol.
      - name: Upload Windows downloads to this Forgejo run
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: windows-x64
          path: dist/downloads/*
          if-no-files-found: error
          retention-days: 30
